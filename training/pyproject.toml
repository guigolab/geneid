[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "geneid-train"
version = "0.0.1"
description = "Pure-Python training pipeline for the geneid gene predictor (U2/U12-aware)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Tyler Alioto" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
geneid-train = "geneid_train.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geneid_train = ["data/*.param", "data/*.NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: exercises real repo param files or a geneid binary (opt-in, slower)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
